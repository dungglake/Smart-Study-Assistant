<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Smart Study Assistant – Planner Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 20px auto;
        }

        h1,
        h2,
        h3 {
            margin-bottom: 0.4rem;
        }

        label {
            margin-right: 8px;
        }

        input {
            margin-right: 8px;
        }

        button {
            margin: 4px;
            padding: 4px 10px;
            cursor: pointer;
        }

        #output {
            background: #f5f5f5;
            padding: 10px;
            max-width: 100%;
            white-space: pre-wrap;
            border: 1px solid #ddd;
        }

        .report-box {
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ddd;
            background: #f9f9ff;
            font-size: 14px;
        }

        .day-block {
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .day-header {
            background: #f0f0f0;
            padding: 6px 10px;
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 6px 8px;
            text-align: left;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }
    </style>
</head>

<body>
    <h1>Smart Study Assistant – Planner Tester</h1>

    <!-- 1. LOGIN -->
    <h2>1. Login (JWT)</h2>
    <p>
        <label>Email:
            <input id="email" type="text" value="test@example.com" />
        </label>
        <label>Password:
            <input id="password" type="password" value="123456" />
        </label>
        <button onclick="login()">Login</button>
    </p>
    <p>Access token: <span id="token" style="font-weight:bold;"></span></p>

    <hr />

    <!-- 2. GENERATE PLAN -->
    <h2>2. Gọi /planner/plan/generate/</h2>
    <p>
        <label>Week start (YYYY-MM-DD):
            <input id="week_start" type="text" value="2025-11-24" />
        </label>
        <button onclick="generatePlan()">Generate Plan</button>
    </p>

    <!-- SUMMARY / REPORT -->
    <div id="report-box" class="report-box" style="display:none;"></div>

    <!-- WEEKLY TIMETABLE -->
    <h3>Weekly Timetable</h3>
    <div id="timetable"></div>

    <!-- RAW JSON -->
    <h3>Raw JSON Response</h3>
    <pre id="output"></pre>

    <script>
        // 👉 CHỈNH LẠI CHO ĐÚNG BACKEND CỦA BẠN
        const API_BASE = "http://localhost:8000";
        const LOGIN_URL = API_BASE + "/api/auth/login/";
        const PLAN_URL = API_BASE + "/api/planner/plan/generate/";

        let accessToken = "";
        const subjectsMap = {};

        function log(obj) {
            document.getElementById("output").textContent =
                typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
        }

        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch(LOGIN_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    log({ status: res.status, error: data });
                    return;
                }

                accessToken = data.access || data.token || "";
                document.getElementById("token").textContent = accessToken || "(no token)";
                log(data);
            } catch (err) {
                log("Login error: " + err);
            }
        }

        function clearSubjectsMap() {
            for (const key in subjectsMap) delete subjectsMap[key];
        }

        async function generatePlan() {
            const weekStart = document.getElementById("week_start").value;

            // Subjects mẫu – sau này bạn có thể fetch từ API thực
            const subjects = [
                { id: 1, name: "Math", difficulty: 2, color: "#ff0000" },
                { id: 2, name: "English", difficulty: 3, color: "#00aa00" }
            ];
            clearSubjectsMap();
            subjects.forEach(s => subjectsMap[s.id] = s.name);

            const body = {
                availability_weekly: [
                    { weekday: 1, start: "08:00", end: "10:00" }, // Mon 08–10
                    { weekday: 3, start: "19:00", end: "22:00" }  // Wed 19–22
                ],
                busy_exceptions: [],
                subjects: subjects,
                tasks: [
                    {
                        id: 1,
                        subject_id: 1,
                        title: "Math - Chapter 1",
                        estimate_minutes: 50,
                        type: "study"
                    },
                    {
                        id: 2,
                        subject_id: 2,
                        title: "English - Vocab",
                        estimate_minutes: 50,
                        type: "study"
                    }
                ],
                exams: [],
                prefs: {
                    week_start: weekStart,
                    horizon_days: 7,
                    session_len_min: 50,
                    break_min: 10,
                    max_daily_min: 240,
                    max_consecutive_sessions: 3,
                    easy_first_week: true,
                    hard_first_day: true,
                    spaced_repetition: true,
                    focus_windows: []
                }
            };

            const headers = { "Content-Type": "application/json" };
            if (accessToken) headers["Authorization"] = "Bearer " + accessToken;

            try {
                const res = await fetch(PLAN_URL, {
                    method: "POST",
                    headers,
                    body: JSON.stringify(body)
                });

                const data = await res.json();
                log({ status: res.status, response: data });

                if (!res.ok) {
                    renderTimetable([]);
                    renderReport(null);
                    return;
                }

                const plan = data.plan || [];
                const report = data.report || null;
                renderTimetable(plan);
                renderReport(report);
            } catch (err) {
                log("Generate error: " + err);
                renderTimetable([]);
                renderReport(null);
            }
        }

        function renderReport(report) {
            const box = document.getElementById("report-box");
            if (!report) {
                box.style.display = "none";
                box.textContent = "";
                return;
            }

            const {
                hours_available,
                hours_required,
                hours_assigned,
                hours_missing,
                utilization_percent
            } = report;

            box.style.display = "block";
            box.innerHTML = `
        <strong>Report:</strong><br/>
        Hours available: <b>${hours_available ?? "?"}</b><br/>
        Hours required: <b>${hours_required ?? "?"}</b><br/>
        Hours assigned: <b>${hours_assigned ?? "?"}</b><br/>
        Hours missing: <b>${hours_missing ?? "?"}</b><br/>
        Utilization: <b>${utilization_percent ?? "?"}%</b>
      `;
        }

        // Timetable: group theo ngày
        function renderTimetable(plan) {
            const container = document.getElementById("timetable");
            container.innerHTML = "";

            if (!plan || plan.length === 0) {
                container.textContent = "No sessions planned.";
                return;
            }

            const sorted = [...plan].sort((a, b) => new Date(a.start) - new Date(b.start));

            // group by date string
            const byDate = {};
            sorted.forEach(item => {
                const d = new Date(item.start);
                const key = d.toISOString().substring(0, 10); // YYYY-MM-DD
                if (!byDate[key]) byDate[key] = [];
                byDate[key].push(item);
            });

            const weekdayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

            Object.keys(byDate).sort().forEach((dateStr) => {
                const sessions = byDate[dateStr];

                const d = new Date(sessions[0].start);
                const label = `${weekdayNames[d.getDay()]} – ${d.toLocaleDateString()}`;

                const dayDiv = document.createElement("div");
                dayDiv.className = "day-block";

                const header = document.createElement("div");
                header.className = "day-header";
                header.textContent = label;
                dayDiv.appendChild(header);

                const table = document.createElement("table");
                const thead = document.createElement("thead");
                thead.innerHTML = `
          <tr>
            <th>#</th>
            <th>Start</th>
            <th>End</th>
            <th>Subject</th>
            <th>Task ID</th>
            <th>Type</th>
            <th>Locked</th>
          </tr>
        `;
                table.appendChild(thead);

                const tbody = document.createElement("tbody");

                sessions.forEach((item, index) => {
                    const tr = document.createElement("tr");

                    const startDate = new Date(item.start);
                    const endDate = new Date(item.end);

                    const startStr = startDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                    const endStr = endDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                    const subjectName = subjectsMap[item.subject_id] || ("Subject #" + item.subject_id);

                    const cells = [
                        index + 1,
                        startStr,
                        endStr,
                        subjectName,
                        item.task_id || "",
                        item.type || "",
                        item.locked ? "Yes" : "No"
                    ];

                    cells.forEach(value => {
                        const td = document.createElement("td");
                        td.textContent = value;
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                dayDiv.appendChild(table);
                container.appendChild(dayDiv);
            });
        }
    </script>
</body>

</html>
